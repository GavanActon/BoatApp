name: Trial build to Cloudflare Pages

# The discovery/achievements trial lives on the `discover` branch and is
# served from its OWN origin (sandies-next.pages.dev, or next.sandies.app
# once the custom domain is attached). A different origin means a separate
# PWA install with separate prefs and offline store, so the trial can never
# touch the family's real app. main → sandies.app is untouched by this file.
#
# One-time setup (dashboard, ~5 minutes) — see docs/DISCOVER-TRIAL.md:
#   one repo secret, CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit).
#   The account id is not a secret — it is printed on the dashboard — so it
#   lives here in the clear.

on:
  push:
    branches: [discover]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trial-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RDWPS waves (best-effort)
        # same as the main deploy: a failed fetch keeps the committed file
        run: |
          pip install --quiet numpy imagecodecs
          python pipeline/fetch_rdwps.py || echo "RDWPS fetch failed — building with the last good waves file"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        # served at the root of its own origin — no BASE_PATH prefix
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ebcafd8e3dbdaad405e17dfb174c0f0f
          # the project is created on the first run; later runs fall through
          preCommands: npx wrangler pages project create sandies-next --production-branch=discover || true
          command: pages deploy app/dist --project-name=sandies-next --branch=discover --commit-dirty=true
