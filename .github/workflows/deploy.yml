name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # redeploy with fresh RDWPS waves after each model run lands. Runs are
  # 00/06/12/18Z and the final-hour file lands ~3h26m later (measured
  # 2026-09-01/02: 03:26, 09:26, 15:26, 21:26 UTC — one outlier at 05:18),
  # and GitHub fires schedules late by minutes. So: a main slot 20 min
  # after the usual landing, plus a catch-up ~2 h on for a late run — the
  # catch-up stops short of deploying when the site already has the run.
  schedule:
    - cron: '45 3,9,15,21 * * *'
    - cron: '30 5,11,17,23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A push supersedes whatever is running; a scheduled wave refresh never
  # cancels anything — it queues. (2026-09-05: a cron run cancelled a push
  # deploy mid-flight, then found nothing newer to carry and skipped, and
  # the site stayed on the old build with nobody the wiser.)
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch RDWPS waves (best-effort)
        # a failed fetch keeps the repo's committed file — never breaks deploy
        run: |
          pip install --quiet numpy imagecodecs
          python pipeline/fetch_rdwps.py || echo "RDWPS fetch failed — deploying with the last good waves file"

      - name: Is there anything new to deploy?
        id: waves
        # Compare RUN STAMPS, not equality: a failed fetch leaves the repo's
        # committed file behind, and that file is usually OLDER than what the
        # site serves — on 2026-09-03 an equality check redeployed a two-day-
        # old run over the fresh one. The ISO stamps sort lexically.
        #  - schedule: deploy only when the fetched run is newer than live
        #  - push/dispatch: always deploy, but never carry a stale waves file
        #    — when live is newer, build with the live copy
        run: |
          local=$(python -c "import json;print(json.load(open('app/public/data/waves-superior.json'))['run'])")
          if curl -sf "https://sandies.app/data/waves-superior.json?t=$(date +%s)" -o /tmp/live-waves.json; then
            live=$(python -c "import json;print(json.load(open('/tmp/live-waves.json'))['run'])")
          else
            live=none
          fi
          echo "fetched run: $local · live run: $live · event: ${{ github.event_name }}"
          if [ "$live" != none ] && [ "$live" \> "$local" ]; then
            echo "site's run is newer than what we have — keeping the live waves file"
            cp /tmp/live-waves.json app/public/data/waves-superior.json
            newer=false
          elif [ "$live" != "$local" ]; then
            newer=true
          else
            newer=false
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$newer" = false ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing newer to carry to the site — skipping the deploy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.waves.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        if: steps.waves.outputs.changed == 'true'
        working-directory: app
        run: npm ci

      - name: Build
        if: steps.waves.outputs.changed == 'true'
        working-directory: app
        # served at the domain root (sandies.app) — no BASE_PATH prefix
        run: npm run build

      - uses: actions/configure-pages@v6
        if: steps.waves.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.waves.outputs.changed == 'true'
        with:
          path: app/dist

      - id: deployment
        if: steps.waves.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
