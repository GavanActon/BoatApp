name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # redeploy with fresh RDWPS waves shortly after each model run lands
  # (runs at 00/06/12/18Z; files appear ~3-4 h later)
  schedule:
    - cron: '30 3,9,15,21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch RDWPS waves (best-effort)
        # a failed fetch keeps the repo's committed file — never breaks deploy
        run: |
          pip install --quiet numpy imagecodecs
          python pipeline/fetch_rdwps.py || echo "RDWPS fetch failed — deploying with the last good waves file"

      - name: Build
        working-directory: app
        # served at the domain root (sandies.app) — no BASE_PATH prefix
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
