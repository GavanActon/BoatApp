name: Next build to Cloudflare Pages

# The `dev` branch is the next build of the app, served from its OWN origin
# (sandies-next.pages.dev, or next.sandies.app once the custom domain is
# attached) and talking to its OWN API (api-next.sandies.app, see
# worker.yml). A different origin means a separate PWA install with separate
# prefs and offline store, so next can never touch the family's real app;
# a different API means a test crew never lands in a real circle.
# main → sandies.app is untouched by this file.
#
# Flow: build on dev, every push lands here; when it is right, fast-forward
# dev into main. One repo secret, `next` (Cloudflare API token: Account ·
# Cloudflare Pages · Edit). The account id is not a secret.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch RDWPS waves (best-effort)
        # same as the main deploy: a failed fetch keeps the committed file
        run: |
          pip install --quiet numpy imagecodecs
          python pipeline/fetch_rdwps.py || echo "RDWPS fetch failed — building with the last good waves file"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        # served at the root of its own origin — no BASE_PATH prefix. Chart
        # data comes from sandies.app: Pages refuses files over 25 MiB and the
        # satellite pmtiles is 28.9 MiB. Only the waves file ships here.
        env:
          VITE_DATA_BASE: https://sandies.app/data/
          VITE_API: https://api-next.sandies.app
        run: |
          npm run build
          find dist/data -type f ! -name 'waves-superior.json' -delete
          ls -la dist/data

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.next }}
          accountId: ebcafd8e3dbdaad405e17dfb174c0f0f
          # the project exists from the trial days with `discover` as its
          # production branch; this points production at dev (idempotent).
          # The action runs preCommands ONE LINE AT A TIME — no continuations.
          preCommands: |
            npx wrangler pages project create sandies-next --production-branch=dev || true
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/ebcafd8e3dbdaad405e17dfb174c0f0f/pages/projects/sandies-next" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"production_branch":"dev"}' | head -c 400; echo
          command: pages deploy app/dist --project-name=sandies-next --branch=dev --commit-dirty=true
